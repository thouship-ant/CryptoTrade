{% extends "_layout.html"%}
{% block title%}Login{%endblock%}
{% block content%}
    <div class="col-md-8 col-lg-6 col-xl-5">
        <div class="card mt-4">

            <div class="card-body p-4">
                <div class="text-center mt-2">
                    <h5 class="text-primary">Lock Screen</h5>
                    <p class="text-muted">Enter your password to unlock the screen!</p>
                </div>
                <div class="user-thumb text-center">
                    <img src="/assets/images/users/{{session['username']}}.jpg" onerror="this.onerror=null; this.src='/assets/images/users/user-dummy-img.jpg'" class="rounded-circle img-thumbnail avatar-lg" alt="thumbnail">
                    <h5 class="font-size-15 mt-3">{{session['full_name']}}</h5>
                </div>
                <div class="p-2 mt-4">
                    <form method="post">
                        <div class="mb-3">
                            <label class="form-label" for="userpassword">Password</label>
                            <input name="password" type="password" class="form-control" id="userpassword" placeholder="Enter password" autocomplete="off" required>
                        </div>
                        <div class="invalid-feedback" style="{{ style_valid['login']}}">
                            Incorrect password.... Please re-check and Unlock with valid password....
                        </div>
                        <div class="mb-2 mt-4">
                            <button class="btn btn-success w-100" type="submit">Unlock</button>
                        </div>
                    </form><!-- end form -->

                </div>
            </div>
            <!-- end card body -->
        </div>
        <!-- end card -->

        <div class="mt-4 text-center">
            <p class="mb-0">Not you ? return <a href="login" class="fw-semibold text-primary text-decoration-underline"> Signin </a> </p>
        </div>

    </div>
{%endblock%}
